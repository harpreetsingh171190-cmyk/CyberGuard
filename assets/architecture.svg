<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="520" fill="#f8fafc" rx="16"/>
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">CyberGuard Plus - how it works</text>
  <g font-size="16" text-anchor="middle">
    <rect x="40" y="200" width="170" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="125" y="240" font-weight="700" fill="#1e3a8a">Input</text>
    <text x="125" y="264" fill="#1e3a8a">URL · CSV · headers</text>
    <text x="125" y="282" fill="#1e3a8a">text · files</text>

    <rect x="290" y="70" width="260" height="380" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="420" y="100" font-weight="700" fill="#155e75">Offline analysis (no network)</text>
    <text x="420" y="140" fill="#164e63">URL heuristics (score 0-100)</text>
    <text x="420" y="175" fill="#164e63">IOC extract · defang · STIX 2.1</text>
    <text x="420" y="210" fill="#164e63">Rule-based hunting</text>
    <text x="420" y="245" fill="#164e63">Email header analyzer</text>
    <text x="420" y="280" fill="#164e63">File triage (SHA-256, entropy)</text>
    <text x="420" y="315" fill="#164e63">Content signatures</text>
    <text x="420" y="350" fill="#164e63">Campaign clustering</text>
    <text x="420" y="385" fill="#164e63">Local allow/block lists</text>
    <text x="420" y="420" fill="#164e63">Incident casebook</text>

    <rect x="620" y="70" width="170" height="110" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="705" y="105" font-weight="700" fill="#713f12">Reputation APIs</text>
    <text x="705" y="130" fill="#713f12">Google Safe Browsing</text>
    <text x="705" y="152" fill="#713f12">VirusTotal (read-only)</text>

    <rect x="620" y="340" width="170" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="705" y="375" font-weight="700" fill="#14532d">Local storage</text>
    <text x="705" y="400" fill="#14532d">SQLite scan history</text>
    <text x="705" y="422" fill="#14532d">JSON casebook</text>

    <rect x="830" y="200" width="140" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="900" y="240" font-weight="700" fill="#4c1d95">Output</text>
    <text x="900" y="264" fill="#4c1d95">Dashboard</text>
    <text x="900" y="282" fill="#4c1d95">JSON · CSV · HTML</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
    <path d="M210 245 H290"/>
    <path d="M550 150 H620"/>
    <path d="M550 395 H620"/>
    <path d="M790 125 C810 125 810 215 830 225"/>
    <path d="M790 395 C810 395 810 275 830 265"/>
  </g>
  <text x="500" y="495" text-anchor="middle" font-size="14" fill="#64748b">Submitted websites are never opened. Only enabled reputation providers receive the URL.</text>
</svg>
